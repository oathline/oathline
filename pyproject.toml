[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oathline"
version = "0.1.0"
description = "A small governance core for AI agents that take real actions: allowlisted capabilities, validated model output, human confirmation tokens and a hash-chained audit log."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Nexxt Nest Group Pty Ltd" }]
requires-python = ">=3.10"
dependencies = []
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]

[tool.setuptools]
packages = ["oathline"]
