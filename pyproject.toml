[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "oathline"
version = "0.1.1"
description = "A small governance core for AI agents that take real actions: allowlisted capabilities, validated model output, human confirmation tokens and a hash-chained audit log."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nexxt Nest Group Pty Ltd" }]
requires-python = ">=3.10"
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/oathline/oathline"
Repository = "https://github.com/oathline/oathline"
Issues = "https://github.com/oathline/oathline/issues"
Changelog = "https://github.com/oathline/oathline/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["oathline"]
